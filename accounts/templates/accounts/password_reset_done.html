{% extends "base.html" %}
{% block title %}Check Your Email | GreenSACCO{% endblock %}
{% block content %}
<div class="auth-page recovery-page">
    <header class="topbar">
        <a class="brand" href="{% url 'accounts:login' %}">
            <span class="brand-mark"><i class="bi bi-leaf-fill"></i></span>
            <span><strong>GreenSACCO</strong><small>Together We Grow</small></span>
        </a>
        <a class="back-login" href="{% url 'accounts:login' %}"><i class="bi bi-arrow-left"></i> Back to Login</a>
    </header>
    <main class="recovery-main">
        <div class="recovery-card">
            <div class="recovery-icon"><i class="bi bi-envelope-check"></i></div>
            <div class="card-heading">
                <h2>Check Your Email</h2>
                <p>If an account exists with that email, we've sent instructions for resetting your password.</p>
            </div>
            <a class="primary-btn button-link" href="{% url 'accounts:login' %}"><span>Return to Login</span><i class="bi bi-arrow-right"></i></a>
        </div>
    </main>
</div>
{% endblock %}
