{% extends "base.html" %}
{% block title %}Password Updated | GreenSACCO{% endblock %}
{% block content %}
<div class="auth-page recovery-page">
    <header class="topbar">
        <a class="brand" href="{% url 'accounts:login' %}">
            <span class="brand-mark"><i class="bi bi-leaf-fill"></i></span>
            <span><strong>GreenSACCO</strong><small>Together We Grow</small></span>
        </a>
    </header>
    <main class="recovery-main">
        <div class="recovery-card">
            <div class="recovery-icon"><i class="bi bi-check-lg"></i></div>
            <div class="card-heading">
                <h2>Password Updated</h2>
                <p>Your password has been successfully changed. You can now securely sign in to your account.</p>
            </div>
            <a class="primary-btn button-link" href="{% url 'accounts:login' %}"><span>Continue to Login</span><i class="bi bi-arrow-right"></i></a>
        </div>
    </main>
</div>
{% endblock %}
