{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}System Management | GreenSACCO{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><style>body{background:#f4f7f5;color:#20352d}.navbar{background:#173d32}.navbar-brand,.navbar .nav-link{color:white}.container-main{max-width:1200px;margin:32px auto}.card{border:0;box-shadow:0 4px 18px #173d3210;border-radius:14px}.btn-primary{background:#176b4d;border-color:#176b4d}.table th{white-space:nowrap}.form-control,.form-select{margin-bottom:.4rem}.page-title{font-weight:700}.muted{color:#6c7d75}</style></head><body><nav class="navbar navbar-expand-lg"><div class="container"><a class="navbar-brand fw-bold" href="{% url 'system_management:dashboard' %}"><i class="bi bi-shield-lock me-2"></i>GreenSACCO Admin</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button><div id="nav" class="collapse navbar-collapse"><div class="navbar-nav ms-auto"><a class="nav-link" href="{% url 'system_management:user_list' %}">Users</a><a class="nav-link" href="{% url 'system_management:member_directory' %}">Members</a><a class="nav-link" href="{% url 'system_management:task_list' %}">Staff tasks</a><a class="nav-link" href="{% url 'system_management:policy_list' %}">Policies</a><a class="nav-link" href="{% url 'system_management:audit_list' %}">Audit log</a><a class="nav-link" href="{% url 'accounts:dashboard' %}">Main dashboard</a></div></div></div></nav><main class="container container-main">{% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show">{{ message }}<button class="btn-close" data-bs-dismiss="alert"></button></div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
